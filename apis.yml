aid: meroxa
name: Meroxa
description: >-
  Meroxa is a low-code, real-time data streaming platform for large-scale data
  movement. Its Conduit Platform moves data between databases, SaaS applications
  and streaming systems using change data capture (CDC), 100+ pre-built
  connectors, and a code-free dashboard, with Meroxa-managed, self-hosted and
  air-gapped deployment modes. Developers build event-driven data applications
  with the open Turbine framework (JavaScript, Python, Ruby, Go) and operate
  them with the `meroxa` CLI. The company is based in San Francisco and is
  backed by Amplify Partners; it holds an AFWERX SBIR Phase II contract for
  real-time event streaming with US Space Systems Command.
